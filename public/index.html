<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX — Movie Collection API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #080911;
      --bg-surface: #101321;
      --bg-card: #15192b;
      --brand-gradient: linear-gradient(135deg, #002be7 0%, #7928ca 50%, #ff0080 100%);
      --brand-glow: 0 0 25px rgba(121, 40, 202, 0.4);
      --text-white: #ffffff;
      --text-muted: #8b97b0;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --danger: #ff3b69;
      --success: #00f090;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .navbar {
      background: rgba(8, 9, 17, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-badge {
      background: var(--brand-gradient);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(121, 40, 202, 0.5);
    }

    .search-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 260px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13.5px;
      width: 100%;
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 13px;
    }

    .container {
      max-width: 1180px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .form-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--brand-gradient);
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .form-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .form-input {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #7928ca;
      box-shadow: 0 0 12px rgba(121, 40, 202, 0.3);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-submit {
      background: var(--brand-gradient);
      color: #fff;
      box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(121, 40, 202, 0.6);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      display: none;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .status-alert {
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }

    .status-alert.success {
      display: block;
      color: var(--success);
    }

    .status-alert.error {
      display: block;
      color: var(--danger);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      border-color: rgba(121, 40, 202, 0.5);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 20px rgba(121, 40, 202, 0.35);
    }

    .card-banner {
      background: linear-gradient(135deg, #1c1335 0%, #0e111a 100%);
      padding: 24px 20px;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-icon {
      font-size: 28px;
      color: #9d4edd;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .card-id {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--text-muted);
    }

    .card-body {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
    }

    .genre-chip {
      background: rgba(121, 40, 202, 0.2);
      color: #c084fc;
      border: 1px solid rgba(121, 40, 202, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .year-chip {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .card-footer {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-edit {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .btn-edit:hover {
      background: #7928ca;
    }

    .btn-delete {
      background: rgba(255, 59, 105, 0.15);
      color: var(--danger);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .navbar {
        padding: 14px 20px;
      }
      .search-box {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="brand-logo">MAX</span>
      <span class="brand-badge">MOVIE API</span>
    </div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search title or genre..." />
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <div class="form-header">
        <h2 id="formTitle" class="form-title">
          <i class="fa-solid fa-film" style="color: #9d4edd;"></i>
          <span>Add New Movie</span>
        </h2>
        <span id="formBadge" style="font-size: 12px; color: var(--text-muted);">MySQL Database</span>
      </div>

      <form id="movieForm">
        <input type="hidden" id="movieId" />
        
        <div class="form-row">
          <input type="text" id="title" class="form-input" placeholder="Movie Title (e.g. Dune)" required />
          <input type="text" id="genre" class="form-input" placeholder="Genre (e.g. Sci-Fi)" required />
          <input type="number" id="year" class="form-input" placeholder="Year (e.g. 2024)" min="1888" max="2100" required />
          
          <div style="display: flex; gap: 8px;">
            <button type="submit" id="submitBtn" class="btn btn-submit">
              <i class="fa-solid fa-plus"></i>
              <span id="submitBtnText">Add Movie</span>
            </button>
            <button type="button" id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">
              Cancel
            </button>
          </div>
        </div>

        <div id="statusAlert" class="status-alert"></div>
      </form>
    </div>

    <div class="section-header">
      <h3 class="section-title">
        <i class="fa-solid fa-clapperboard" style="color: #7928ca;"></i>
        <span>Featured Collection</span>
      </h3>
      <span id="countText" style="color: var(--text-muted); font-size: 13px;">0 Movies</span>
    </div>

    <div id="moviesGrid" class="movies-grid"></div>
  </main>

  <script>
    let movies = [];
    const movieForm = document.getElementById('movieForm');
    const movieIdInput = document.getElementById('movieId');
    const titleInput = document.getElementById('title');
    const genreInput = document.getElementById('genre');
    const yearInput = document.getElementById('year');
    const formTitle = document.getElementById('formTitle');
    const submitBtnText = document.getElementById('submitBtnText');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusAlert = document.getElementById('statusAlert');
    const searchInput = document.getElementById('searchInput');

    async function loadMovies() {
      try {
        const res = await fetch('/api/movies');
        movies = await res.json();
        renderMovies();
      } catch (err) {
        showStatus('Failed to load movies from MySQL database.', 'error');
      }
    }

    function renderMovies() {
      const grid = document.getElementById('moviesGrid');
      const countText = document.getElementById('countText');
      const search = searchInput.value.toLowerCase().trim();

      const filtered = movies.filter(m => 
        m.title.toLowerCase().includes(search) || 
        m.genre.toLowerCase().includes(search)
      );

      countText.textContent = `${filtered.length} ${filtered.length === 1 ? 'Movie' : 'Movies'}`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No movies found. Add one above!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(movie => `
        <div class="movie-card">
          <div class="card-banner">
            <span class="card-id">#${movie.id}</span>
            <div class="card-icon"><i class="fa-solid fa-film"></i></div>
            <div class="card-title">${escapeHtml(movie.title)}</div>
          </div>
          <div class="card-body">
            <span class="genre-chip">${escapeHtml(movie.genre)}</span>
            <span class="year-chip">${movie.year}</span>
          </div>
          <div class="card-footer">
            <button class="btn-action btn-edit" onclick="startEdit(${movie.id})">
              <i class="fa-solid fa-pen"></i> Edit
            </button>
            <button class="btn-action btn-delete" onclick="deleteMovie(${movie.id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    movieForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = movieIdInput.value;
      const movieData = {
        title: titleInput.value.trim(),
        genre: genreInput.value.trim(),
        year: parseInt(yearInput.value, 10)
      };

      try {
        let res;
        if (id) {
          res = await fetch(`/api/movies/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(movieData)
          });
        } else {
          res = await fetch('/api/movies', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(movieData)
          });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        showStatus(id ? 'Movie updated successfully!' : 'Movie added successfully!', 'success');
        resetForm();
        await loadMovies();
      } catch (err) {
        showStatus(err.message, 'error');
      }
    });

    function startEdit(id) {
      const movie = movies.find(m => m.id === id);
      if (!movie) return;

      movieIdInput.value = movie.id;
      titleInput.value = movie.title;
      genreInput.value = movie.genre;
      yearInput.value = movie.year;

      formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square" style="color: #00f2fe;"></i><span>Edit Movie #${movie.id}</span>`;
      submitBtnText.textContent = 'Update Movie';
      cancelBtn.style.display = 'inline-flex';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      movieForm.reset();
      movieIdInput.value = '';
      formTitle.innerHTML = `<i class="fa-solid fa-film" style="color: #9d4edd;"></i><span>Add New Movie</span>`;
      submitBtnText.textContent = 'Add Movie';
      cancelBtn.style.display = 'none';
    }

    async function deleteMovie(id) {
      if (!confirm('Are you sure you want to delete this movie?')) return;

      try {
        const res = await fetch(`/api/movies/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete');

        showStatus('Movie deleted successfully.', 'success');
        if (movieIdInput.value == id) resetForm();
        await loadMovies();
      } catch (err) {
        showStatus(err.message, 'error');
      }
    }

    function showStatus(msg, type) {
      statusAlert.textContent = msg;
      statusAlert.className = `status-alert ${type}`;
      setTimeout(() => {
        statusAlert.className = 'status-alert';
      }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    searchInput.addEventListener('input', renderMovies);
    window.addEventListener('DOMContentLoaded', loadMovies);
  </script>
</body>
</html>
